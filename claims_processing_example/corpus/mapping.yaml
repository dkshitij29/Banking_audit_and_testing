  not_modelled:
    - section: "3.5 Hospital Cash"
      text: "we will pay Hospital Cash at the rate of 0.1% of the Sum Insured, for each day of Hospitalisation"
      reading: >-
        A daily allowance rather than reimbursement of a bill, which the engine does
        not model. It is therefore absent from the wording the agent is given, so
        nothing the agent reads depends on it.
    - section: "3.7 Payment of ambulance charges"
      text: "We will pay You the charges for Ambulance services not exceeding 1% of the Sum Insured"
      reading: No bill in the dataset carries ambulance charges.
    - section: "3.10 Reinstatement of Sum Insured"
      text: "If the Sum Insured is exhausted due to a claim admissible under the Policy, then the Sum Insured shall be reinstated"
      reading: No case has an earlier claim in the same policy year.
    - section: "3.20 Coverage for modern treatments or procedures"
      text: "The following procedures will be covered (wherever medically indicated) either as in patient or as part of day care treatment in a hospital up to the limit specified against each procedure"
      reading: No catalogue procedure is on the list.
    - section: "3.13; 3.14; 3.15; 3.17"
      text: "OPTIONAL COVER I: NO PROPORTIONATE DEDUCTION"
      reading: The optional covers are not bought on any sampled policy.
    - section: "5.24 Enhancement of Sum Insured"
      text: "In respect of any enhancement of Sum Insured, exclusions 4.1, 4.2 and 4.3 would apply to the additional Sum Insured from such date."
      reading: No policy has had its sum insured raised.
