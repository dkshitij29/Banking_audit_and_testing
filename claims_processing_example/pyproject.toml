[project]
name = "claims-benchmark"
version = "0.1.0"
description = "Benchmark dataset generator for Indian health insurance claim adjudication"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pypdf>=5",
    "pytest>=8",
    "pyyaml>=6",
    "weasyprint>=62",
]

[tool.ruff.lint]
# ruff's classic default rules, pinned so a newer ruff does not change what "clean" means.
select = ["E4", "E7", "E9", "F"]
